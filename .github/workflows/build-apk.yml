name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Buat keystore jika belum ada di repository
        run: |
          [ -f app/dompet.keystore ] || keytool -genkeypair -keystore app/dompet.keystore \
            -storepass dompet123 -keypass dompet123 -alias dompet -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Dompet, O=Pribadi, C=ID"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Beri nama file tetap
        run: cp app/build/outputs/apk/debug/app-debug.apk Dompet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dompet-apk
          path: Dompet.apk
      - name: Terbitkan ke Releases (link unduh tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dompet build ${{ github.run_number }}
          make_latest: true
          files: Dompet.apk
